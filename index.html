    function ensureXLSX() {
        return new Promise((resolve) => {
            if (window.XLSX)
                return resolve(true);
            const urls = [
                "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
                "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js",
                "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js",
            ];
            let i = 0;
            const tryNext = () => {
                if (window.XLSX)
                    return resolve(true);
                if (i >= urls.length)
                    return resolve(false);
                const s = document.createElement("script");
                s.src = urls[i++];
                s.onload = () => resolve(!!window.XLSX);
                s.onerror = tryNext;
                document.head.appendChild(s);
            };
            tryNext();
        });
    }

    function matchPlayerByName(transcript) {
        const stop = new Set(["face", "off", "on", "the", "a", "an", "of", "goal", "goals", "score", "scored", "win", "won", "lost", "loss", "faceoff", "ground", "groundball", "ball", "balls", "caused", "turnover", "turn", "over", "save", "saves", "penalty", "penalties", "miss", "missed", "wide", "cage", "shot", "assist", "assists", "man", "up", "down", "short", "handed", "shorthanded", "our", "opponent", "other", "team", "they", "and", "to", "for", "number", "no", "got", "had", "with", "clear", "failed"]);
        const words = (transcript || "").toLowerCase().replace(/[^a-z\s]/g, " ").split(/\s+/).filter((w) => w.length >= 2 && !stop.has(w));
        if (!words.length)
            return null;
        for (const w of words) {
            const p = roster.find((pl) => ((pl.name || "").toLowerCase().split(/\s+/)[0]) === w);
            if (p)
                return p;
        }
        for (const w of words) {
            const p = roster.find((pl) => (pl.name || "").toLowerCase().includes(w));
            if (p)
                return p;
        }
        return null;
    }

.mic-on .mic-dot { background:#FF5A5A; animation:pulse 1s infinite; }
.voice-status { font-size:12.5px; color:var(--dim); line-height:1.35; min-width:0; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }

/* goalie */
.goaliebar { display:flex; align-items:center; gap:10px; margin:8px 14px 0; padding:8px 10px 8px 8px;
  background:var(--bg2); border:1px solid var(--line); border-radius:14px; min-height:52px; }
.goalie-set { flex:1; background:var(--bg3); color:var(--text); border:1px dashed var(--line); border-radius:11px;
  padding:11px; font-family:'Barlow'; font-weight:600; font-size:14px; cursor:pointer; }
.goalie-set:disabled { opacity:.45; }
.goalie-name { flex:1; display:flex; align-items:center; gap:10px; background:transparent; border:none; color:var(--text);
  cursor:pointer; text-align:left; padding:2px; min-width:0; }
.goalie-badge { font-family:'Barlow Condensed'; font-weight:800; font-size:15px; color:#0b130f; width:34px; height:34px;
  border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-variant-numeric:tabular-nums; }
.goalie-txt { display:flex; flex-direction:column; min-width:0; }
.goalie-who { font-weight:600; font-size:14.5px; }
.goalie-change { color:var(--dim); font-weight:500; font-size:12px; }
.goalie-line { font-size:11.5px; color:var(--dim); font-variant-numeric:tabular-nums; margin-top:1px; }
.goalie-save { flex-shrink:0; background:var(--bg3); color:var(--text); border:1px solid var(--line); border-radius:999px;
  padding:9px 15px; font-family:'Barlow'; font-weight:700; font-size:13.5px; cursor:pointer; }
.goalie-save:active { background:#23362c; }

/* toast */
.toast { position:fixed; bottom:92px; left:50%; transform:translateX(-50%); background:var(--gold); color:#1a1205;
  font-family:'Barlow'; font-weight:600; font-size:14px; padding:11px 20px; border-radius:999px; z-index:60;
  box-shadow:0 8px 24px rgba(0,0,0,.4); animation:fade .15s ease; }

@keyframes rise { from { transform:translateY(30px); opacity:.4; } to { transform:translateY(0); opacity:1; } }
@keyframes fade { from { opacity:0; } to { opacity:1; } }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }

/* printable report */
.report-overlay { position:fixed; inset:0; background:#2a2f2c; z-index:200; overflow:auto; }
.report-bar { position:sticky; top:0; display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 16px; background:#0B130F; border-bottom:1px solid var(--line); z-index:2; }
.report-barlabel { font-size:13px; color:var(--dim); }
.report { background:#fff; color:#12223a; max-width:760px; margin:16px auto; padding:30px 34px;
  font-family:'Barlow', system-ui, sans-serif; box-shadow:0 8px 40px rgba(0,0,0,.4); }
.rpt-head { border-bottom:3px solid #12223a; padding-bottom:10px; margin-bottom:6px; }
.rpt-team { font-family:'Barlow Condensed'; font-weight:800; font-size:26px; letter-spacing:.06em; color:#12223a; text-transform:uppercase; line-height:1; }
.rpt-sub { color:#5a6b82; font-size:12.5px; margin-top:4px; }
.rpt-sec-title { font-family:'Barlow Condensed'; font-weight:700; font-size:14px; letter-spacing:.09em; text-transform:uppercase;
  color:#12223a; background:#eef1f6; padding:6px 10px; margin:18px 0 10px; border-left:4px solid #12223a; }
.rpt-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
.rpt-tile { border:1px solid #d5dbe6; border-radius:6px; padding:8px 6px; text-align:center; }
.rpt-tile .v { font-family:'Barlow Condensed'; font-weight:800; font-size:18px; color:#12223a; font-variant-numeric:tabular-nums; line-height:1; }
.rpt-tile .k { font-size:8.5px; text-transform:uppercase; letter-spacing:.03em; color:#5a6b82; margin-top:3px; }
.rpt-note { font-size:11px; color:#5a6b82; margin-top:10px; font-variant-numeric:tabular-nums; }
.rpt-table { width:100%; border-collapse:collapse; font-size:10.5px; margin-top:2px; font-variant-numeric:tabular-nums; }
.rpt-table th { background:#12223a; color:#fff; padding:5px 5px; text-align:center; font-family:'Barlow Condensed'; font-weight:600; letter-spacing:.03em; white-space:nowrap; }
.rpt-table th:first-child, .rpt-table td:first-child { text-align:left; }
.rpt-table td { padding:4px 5px; text-align:center; border-bottom:1px solid #e2e7ef; color:#12223a; }
.rpt-grouprow td { background:#eef1f6; font-family:'Barlow Condensed'; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:#12223a; text-align:left; }
.rpt-totalrow td { font-weight:700; border-top:2px solid #12223a; }
.rpt-stand { display:flex; justify-content:space-between; gap:10px; padding:5px 2px; border-bottom:1px solid #e2e7ef; font-size:12px; color:#12223a; }
.rpt-stand-v { font-weight:700; color:#12223a; white-space:nowrap; }
.rpt-foot { margin-top:22px; padding-top:8px; border-top:1px solid #d5dbe6; font-size:10px; color:#8a97ab; text-align:center; }
.pcards-report { }
.pcard-block { border:1px solid #d5dbe6; border-radius:12px; overflow:hidden; background:#fff; max-width:520px; margin:0 auto;
  break-inside:avoid; -webkit-column-break-inside:avoid; page-break-inside:avoid; }
.pcards-all { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.pcards-all .pcard-block { max-width:none; margin:0; }
.pcp-head { display:flex; align-items:center; gap:14px; padding:16px 18px; }
.pcp-body { padding:14px 16px 16px; }
.pcp-num { font-family:'Barlow Condensed'; font-weight:800; font-size:52px; line-height:1; color:#fff; background:rgba(255,255,255,.12); border-radius:12px; padding:6px 14px; min-width:64px; text-align:center; }
.pcp-name { font-family:'Barlow Condensed'; font-weight:800; font-size:30px; text-transform:uppercase; letter-spacing:.03em; line-height:1.02; }
.pcp-meta { color:#aebfd6; font-size:13px; margin-top:3px; }
.pcp-scope { font-size:11px; color:#5a6b82; text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px; }
.pcp-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.pcp-tile { border:1px solid #d5dbe6; border-radius:8px; padding:11px 6px; text-align:center; }
.pcp-v { font-family:'Barlow Condensed'; font-weight:800; font-size:24px; color:#12223a; font-variant-numeric:tabular-nums; line-height:1; }
.pcp-k { font-size:9px; text-transform:uppercase; letter-spacing:.03em; color:#5a6b82; margin-top:3px; }
.pcp-photo { width:66px; height:66px; border-radius:12px; object-fit:cover; margin-left:auto; border:2px solid rgba(255,255,255,.35); flex-shrink:0; }
.pcp-gbg th { background:transparent !important; }
.card-controls { max-width:760px; margin:14px auto 0; padding:12px 16px; background:var(--bg2); border:1px solid var(--line); border-radius:14px; }
.cc-row { display:flex; align-items:center; gap:12px; padding:5px 0; }
.cc-label { width:56px; font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
.cc-swatches { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.cc-sw { width:28px; height:28px; border-radius:8px; border:2px solid transparent; cursor:pointer; padding:0; position:relative; overflow:hidden; }
.cc-on { border-color:var(--gold); box-shadow:0 0 0 2px rgba(0,0,0,.3) inset; }
.cc-custom input { position:absolute; inset:-6px; width:44px; height:44px; border:none; padding:0; background:none; cursor:pointer; }
.cc-photo-btns { display:flex; gap:8px; }
.seg { display:inline-flex; background:var(--bg3); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.seg button { background:transparent; border:none; color:var(--dim); font-family:'Barlow'; font-weight:700; font-size:13px; padding:8px 14px; cursor:pointer; }
.seg .seg-on { background:var(--gold); color:#1a1205; }
@media print { .pcards-all { grid-template-columns:1fr 1fr; } }
.sheet-card { background:var(--bg3); border:1px solid var(--line); color:var(--gold); font-weight:700; font-size:13px; border-radius:9px; padding:7px 12px; cursor:pointer; margin-right:8px; }
.sc-suite { margin-bottom:14px; }
.sc-suite-head { display:flex; justify-content:space-between; font-family:'Barlow Condensed'; font-weight:700; font-size:14px;
  letter-spacing:.04em; text-transform:uppercase; color:var(--text); padding:6px 2px; border-bottom:1px solid var(--line); margin-bottom:4px; }
.sc-allpass { color:#4ADE80; }
.sc-somefail { color:#FF9AA5; }
.sc-row { display:flex; align-items:center; gap:10px; padding:6px 2px; }
.sc-badge { font-family:'Barlow Condensed'; font-weight:700; font-size:10px; padding:2px 6px; border-radius:5px; flex-shrink:0; width:40px; text-align:center; }
.sc-pass { background:rgba(74,222,128,.15); color:#4ADE80; }
.sc-fail { background:rgba(255,122,122,.16); color:#FF9AA5; }
.sc-label { flex:1; font-size:13.5px; }
.sc-val { font-family:'Barlow Condensed'; font-weight:700; font-size:14px; font-variant-numeric:tabular-nums; color:var(--dim); }
.confirm-msg { font-size:15px; line-height:1.5; padding:6px 2px 16px; color:var(--text); }
.fld-label { display:block; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--dim); margin:10px 2px 4px; }
.row-toggle { display:flex; align-items:center; justify-content:space-between; font-size:14px; font-weight:600; padding:4px 2px; }
.row-toggle input { width:20px; height:20px; accent-color:var(--gold); }

@media print {
  .app > *:not(.report-overlay) { display:none !important; }
  .report-overlay { position:static; background:#fff; overflow:visible; }
  .report-bar { display:none !important; }
  .report { margin:0; max-width:none; box-shadow:none; padding:0; }
  .rpt-table { font-size:9.5px; }
  .no-print { display:none !important; }
}
